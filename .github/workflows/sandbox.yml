name: Isolated candidate execution
run-name: sandbox-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      payload:
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: docker pull python:3.12-slim
      - name: Execute candidate in isolated container
        env:
          REPAIR_PAYLOAD: ${{ inputs.payload }}
        run: python scripts/execute_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-result
          path: sandbox-result.json
          retention-days: 7
